name: Terraform PR

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: envs/dev
        run: terraform init -input=false

      - name: Load application secret from SSM
        run: |
          DB_PASSWORD="$(aws ssm get-parameter \
            --name /novasphere/dev/db_password \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)"
          echo "::add-mask::$DB_PASSWORD"
          printf 'TF_VAR_db_password=%s\n' "$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Terraform validate
        working-directory: envs/dev
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: envs/dev
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false > plan.txt 2>&1
          CODE=$?
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            let plan = fs.readFileSync("envs/dev/plan.txt", "utf8");

            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + "\n\n... plan truncated ...";
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: "COMMENT",
              body: `### Terraform plan - DEV

            <details>
            <summary>Afficher le plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>`
            });

      - name: Fail if Terraform plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
